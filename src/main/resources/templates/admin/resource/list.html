<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>资源管理</title>
	<header th:replace="header::html"></header>
</head>
<body class="pear-container">
<div class="layui-card">
	<div class="layui-card-body">
		<form class="layui-form" action="">
			<div class="layui-form-item">
				<div class="layui-inline">
					<label class="layui-form-label">标题</label>
					<div class="layui-input-inline">
						<input type="text" name="title" placeholder="请输入标题" class="layui-input">
					</div>
				</div>
				<div class="layui-inline">
					<label class="layui-form-label">分类</label>
					<div class="layui-input-inline">
						<select name="categoryId" lay-search>
							<option value="">全部分类</option>
						</select>
					</div>
				</div>
				<div class="layui-inline">
					<label class="layui-form-label">状态</label>
					<div class="layui-input-inline">
						<select name="status">
							<option value="">全部状态</option>
							<option value="1">已发布</option>
							<option value="0">已下架</option>
						</select>
					</div>
				</div>
				<button id="resource-query" class="pear-btn pear-btn-md pear-btn-primary" lay-submit="" lay-filter="resource-query">
					<i class="layui-icon layui-icon-search"></i>
					查询
				</button>
				<button type="reset" class="pear-btn pear-btn-md">
					<i class="layui-icon layui-icon-refresh"></i>
					重置
				</button>
			</div>
		</form>
	</div>
</div>

<div class="layui-card">
	<div class="layui-card-body">
		<table id="resource-table" lay-filter="resource-table"></table>
	</div>
</div>

<!-- 统计卡片 -->
<div class="layui-row layui-col-space15" style="margin-top: 15px;">
	<div class="layui-col-md3">
		<div class="layui-card">
			<div class="layui-card-body">
				<div class="layui-text">
					<h3>总资源数</h3>
					<p class="layui-text-center" id="total-count" style="font-size: 24px; color: #1E9FFF;">0</p>
				</div>
			</div>
		</div>
	</div>
	<div class="layui-col-md3">
		<div class="layui-card">
			<div class="layui-card-body">
				<div class="layui-text">
					<h3>今日新增</h3>
					<p class="layui-text-center" id="today-count" style="font-size: 24px; color: #FF5722;">0</p>
				</div>
			</div>
		</div>
	</div>
	<div class="layui-col-md3">
		<div class="layui-card">
			<div class="layui-card-body">
				<div class="layui-text">
					<h3>总下载量</h3>
					<p class="layui-text-center" id="total-downloads" style="font-size: 24px; color: #FFB800;">0</p>
				</div>
			</div>
		</div>
	</div>
	<div class="layui-col-md3">
		<div class="layui-card">
			<div class="layui-card-body">
				<div class="layui-text">
					<h3>总浏览量</h3>
					<p class="layui-text-center" id="total-views" style="font-size: 24px; color: #009688;">0</p>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/html" id="resource-toolbar">
	<button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchOffline">
		<i class="layui-icon layui-icon-close"></i>
		批量下架
	</button>
</script>

<script type="text/html" id="resource-bar">
	<button class="pear-btn pear-btn-primary pear-btn-sm" lay-event="view" title="查看详情">
		<i class="layui-icon layui-icon-read"></i>
	</button>
	<button class="pear-btn pear-btn-success pear-btn-sm" lay-event="publish" title="发布">
		<i class="layui-icon layui-icon-release"></i>
	</button>
	<button class="pear-btn pear-btn-warming pear-btn-sm" lay-event="offline" title="下架">
		<i class="layui-icon layui-icon-close"></i>
	</button>
	<button class="pear-btn pear-btn-danger pear-btn-sm" lay-event="remove" title="删除">
		<i class="layui-icon layui-icon-delete"></i>
	</button>
</script>

<script type="text/html" id="resource-status">
	{{# if(d.status == 1){ }}
		<span class="layui-badge layui-bg-green">已发布</span>
	{{# } else { }}
		<span class="layui-badge layui-bg-orange">已下架</span>
	{{# } }}
</script>

<script type="text/html" id="resource-fileType">
	<span class="layui-badge layui-bg-blue">{{d.fileType}}</span>
</script>

<script type="text/html" id="resource-createTime">
	{{layui.util.toDateString(d.createTime, 'yyyy-MM-dd HH:mm:ss')}}
</script>

<script>
	layui.use(['table', 'form', 'jquery', 'popup'], function () {
		let table = layui.table;
		let form = layui.form;
		let $ = layui.jquery;
		let popup = layui.popup;

		let cols = [
			[
				{type:'checkbox'},
				{title: 'ID', field: 'resourceId', align:'center', width:80},
				{title: '资源标题', field: 'title', align:'center', width:250},
				{title: '分类', field: 'categoryName', align:'center', width:120},
				{title: '上传者', field: 'uploaderName', align:'center', width:120},
				{title: '文件类型', field: 'fileType', align:'center', width:100, templet:'#resource-fileType'},
				{title: '文件大小', field: 'fileSize', align:'center', width:100, templet: function(d){
					if(!d.fileSize) return '-';
					const size = d.fileSize;
					if(size < 1024) return size + ' B';
					if(size < 1024*1024) return (size/1024).toFixed(2) + ' KB';
					return (size/(1024*1024)).toFixed(2) + ' MB';
				}},
				{title: '状态', field: 'status', align:'center', width:100, templet:'#resource-status'},
				{title: '统计', align:'center', width:180, templet: function(d){
					return '浏览:'+ (d.viewCount || 0) + ' 下载:' + (d.downloadCount || 0) + ' 收藏:' + (d.collectCount || 0);
				}},
				{title: '创建时间', field: 'createTime', align:'center', width:160, templet:'#resource-createTime'},
				{title: '操作', toolbar: '#resource-bar', align:'center', width:200, fixed:'right'}
			]
		]

		var tableIns = table.render({
			elem: '#resource-table',
			url: '/api/admin/resource',
			page: true,
			cols: cols,
			skin: 'line',
			toolbar: '#resource-toolbar',
			defaultToolbar: [{
				layEvent: 'refresh',
				icon: 'layui-icon-refresh',
			}, 'filter', 'exports'],
			response: {
				statusCode: 0  // 指定成功的状态码为 0
			},
			done: function(res) {
				// 加载统计数据
				loadStatistics();
			}
		});

		// 加载统计数据
		function loadStatistics() {
			$.get('/api/admin/resource/statistics', function(result) {
				if(result.code == 0 && result.data && result.data.length > 0) {
					var stats = result.data[0];
					$('#total-count').text(stats.total || 0);
					$('#today-count').text(stats.today || 0);
					$('#total-downloads').text(stats.totalDownloads || 0);
					$('#total-views').text(stats.totalViews || 0);
				}
			});
		}

		// 监听工具栏事件
		table.on('toolbar(resource-table)', function(obj) {
			if (obj.event === 'batchOffline') {
				var checkStatus = table.checkStatus('resource-table');
				var data = checkStatus.data;
				if(data.length === 0) {
					layer.msg('请选择要下架的资源', {icon: 2});
					return;
				}
				var resourceIds = data.map(function(item) { return item.resourceId; });
				layer.confirm('确定要下架选中的 ' + data.length + ' 个资源吗？', function(index) {
					$.ajax({
						url: '/api/admin/resource/batchOffline',
						method: 'post',
						contentType: 'application/json',
						data: JSON.stringify(resourceIds),
						success: function(res) {
							if(res.code == 0) {
								layer.msg('下架成功', {icon: 1});
								tableIns.reload();
							} else {
								layer.msg(res.msg || '下架失败', {icon: 2});
							}
						}
					});
					layer.close(index);
				});
			}
		});

		// 监听行工具事件
		table.on('tool(resource-table)', function(obj) {
			var data = obj.data;
			if (obj.event === 'view') {
				popup.open({
					type: 1,
					title: '资源详情',
					area: ['800px', '600px'],
					content: '<div style="padding: 20px;">' +
						'<p><strong>标题：</strong>' + data.title + '</p>' +
						'<p><strong>描述：</strong>' + (data.description || '无') + '</p>' +
						'<p><strong>文件名：</strong>' + (data.fileName || '无') + '</p>' +
						'<p><strong>文件大小：</strong>' + (data.fileSize || 0) + ' bytes</p>' +
						'<p><strong>上传者：</strong>' + (data.uploaderName || '未知') + '</p>' +
						'<p><strong>分类：</strong>' + (data.categoryName || '未分类') + '</p>' +
						'<p><strong>状态：</strong>' + (data.status == 1 ? '已发布' : '已下架') + '</p>' +
						'<p><strong>浏览量：</strong>' + (data.viewCount || 0) + '</p>' +
						'<p><strong>下载量：</strong>' + (data.downloadCount || 0) + '</p>' +
						'<p><strong>收藏量：</strong>' + (data.collectCount || 0) + '</p>' +
						'<p><strong>创建时间：</strong>' + layui.util.toDateString(data.createTime, 'yyyy-MM-dd HH:mm:ss') + '</p>' +
						'</div>'
				});
			} else if (obj.event === 'publish') {
				if(data.status == 1) {
					layer.msg('该资源已是发布状态', {icon: 1});
					return;
				}
				layer.confirm('确定要发布该资源吗？', function(index) {
					$.ajax({
						url: '/api/admin/resource/publish/' + data.resourceId,
						method: 'put',
						success: function(res) {
							if(res.code == 0) {
								layer.msg('发布成功', {icon: 1});
								tableIns.reload();
							} else {
								layer.msg(res.msg || '发布失败', {icon: 2});
							}
						}
					});
					layer.close(index);
				});
			} else if (obj.event === 'offline') {
				if(data.status == 0) {
					layer.msg('该资源已是下架状态', {icon: 1});
					return;
				}
				layer.confirm('确定要下架该资源吗？', function(index) {
					$.ajax({
						url: '/api/admin/resource/offline/' + data.resourceId,
						method: 'put',
						success: function(res) {
							if(res.code == 0) {
								layer.msg('下架成功', {icon: 1});
								tableIns.reload();
							} else {
								layer.msg(res.msg || '下架失败', {icon: 2});
							}
						}
					});
					layer.close(index);
				});
			} else if (obj.event === 'remove') {
				layer.confirm('确定要删除该资源吗？删除后无法恢复！', function(index) {
					$.ajax({
						url: '/api/resource/' + data.resourceId,
						method: 'delete',
						success: function(res) {
							if(res.code == 0) {
								layer.msg('删除成功', {icon: 1});
								tableIns.reload();
							} else {
								layer.msg(res.msg || '删除失败', {icon: 2});
							}
						}
					});
					layer.close(index);
				});
			}
		});

		// 监听查询提交
		form.on('submit(resource-query)', function(data) {
			tableIns.reload({
				where: data.field,
				page: {
					curr: 1
				}
			});
			return false;
		});

		// 加载分类下拉框
		$.ajax({
			url: '/api/resource/category',
			method: 'get',
			success: function(res) {
				if(res.code == 0 && res.data) {
					var options = '<option value="">全部分类</option>';
					res.data.forEach(function(item) {
						options += '<option value="' + item.id + '">' + item.name + '</option>';
					});
					$('select[name="categoryId"]').html(options);
					form.render('select');
				}
			}
		});
	});
</script>
</body>
</html>
