<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>文章管理</title>
    <header th:replace="header::html"></header>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <div class="layui-inline">
                    <label class="layui-form-label">标题</label>
                    <div class="layui-input-inline">
                        <input type="text" name="title" placeholder="请输入标题" class="layui-input">
                    </div>
                </div>
                <div class="layui-inline">
                    <label class="layui-form-label">分类</label>
                    <div class="layui-input-inline">
                        <select name="categoryId" lay-search>
                            <option value="">全部分类</option>
                        </select>
                    </div>
                <div class="layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status">
                            <option value="">全部状态</option>
                            <option value="0">草稿</option>
                            <option value="1">已发布</option>
                            <option value="2">已下架</option>
                        </select>
                    </div>
                <button id="article-query" class="pear-btn pear-btn-md pear-btn-primary" lay-submit="" lay-filter="article-query">
                    <i class="layui-icon layui-icon-search"></i>
                    查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i>
                    重置
                </button>
            </div>
        </form>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-body">
        <table id="article-table" lay-filter="article-table"></table>
    </div>
</div>

<!-- 统计卡片 -->
<div class="layui-row layui-col-space15" style="margin-top: 15px;">
    <div class="layui-col-md3">
        <div class="layui-card">
            <div class="layui-card-body">
                <div class="layui-text">
                    <h3>总文章数</h3>
                    <p class="layui-text-center" id="total-articles" style="font-size: 24px; color: #1E9FFF;">0</p>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="layui-card">
            <div class="layui-card-body">
                <div class="layui-text">
                    <h3>今日新增</h3>
                    <p class="layui-text-center" id="today-articles" style="font-size: 24px; color: #FF5722;">0</p>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="layui-card">
            <div class="layui-card-body">
                <div class="layui-text">
                    <h3>总浏览量</h3>
                    <p class="layui-text-center" id="total-views" style="font-size: 24px; color: #009688;">0</p>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-col-md3">
        <div class="layui-card">
            <div class="layui-card-body">
                <div class="layui-text">
                    <h3>总点赞数</h3>
                    <p class="layui-text-center" id="total-likes" style="font-size: 24px; color: #FFB800;">0</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 工具栏模板 -->
<script type="text/html" id="article-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchOffline">
        <i class="layui-icon layui-icon-close"></i>
        批量下架
    </button>
</script>

<!-- 行操作模板 -->
<script type="text/html" id="article-bar">
    <button class="pear-btn pear-btn-primary pear-btn-sm" lay-event="publish">发布</button>
    <button class="pear-btn-danger pear-btn-sm" lay-event="remove">删除</button>
</script>

<!-- 状态模板 -->
<script type="text/html" id="article-status">
    {{# if(d.status == 0){ }}
        <span class="layui-badge layui-bg-gray">草稿</span>
    {{# } else if(d.status == 1){ }}
        <span class="layui-badge layui-bg-green">已发布</span>
    {{# } else { }}
        <span class="layui-badge layui-bg-orange">已下架</span>
    {{# } }}
</script>

<script type="text/html" id="article-cover">
    {{# if(d.coverImage != null && d.coverImage != ''){ }}
        <img src="{{d.coverImage}}" style="max-width: 100px; max-height: 60px;" />
    {{# } else { }}
        <i class="layui-icon layui-icon-picture" style="font-size: 20px; color: #999;"></i>
    {{# } }}
</script>

<script type="text/html" id="article-createTime">
    {{layui.util.toDateString(d.createTime, 'yyyy-MM-dd HH:mm:ss')}}
</script>

<script type="text/html" id="article-author">
    {{d.authorName}}
</script>

<script>
    layui.use(['table', 'form', 'jquery', 'popup'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let popup = layui.popup;

        let cols = [
            [
                {type:'checkbox'},
                {title: 'ID', field: 'articleId', width: 80},
                {title: '标题', field: 'title', width: 250},
                {title: '分类', field: 'categoryName', width: 120},
                {title: '作者', field: 'authorName', width: 120},
                {title: '状态', field: 'status', width: 100, templet: '#article-status'},
                {title: '浏览', field: 'viewCount', width: 80},
                {title: '点赞', field: 'likeCount', width: 80},
                {title: '创建时间', field: 'createTime', width: 160, templet: '#article-createTime'},
                {title: '操作', toolbar: '#article-bar', fixed: 'right', width: 200}
            ]
        ];

        var tableIns = table.render({
            elem: '#article-table',
            url: '/api/admin/article',
            page: true,
            cols: cols,
            skin: 'line',
            toolbar: '#article-toolbar',
            defaultToolbar: [{
                layEvent: 'refresh',
                icon: 'layui-icon-refresh',
            }, 'filter', 'exports'],
            response: {
                statusCode: 0  // 指定成功的状态码为 0
            },
            done: function(res) {
                loadStatistics();
            }
        });

        // 监听工具栏事件
        table.on('toolbar(article-table)', function(obj){
            if(obj.event === 'add'){
                layer.open({
                    type: 2,
                    title: '新增文章',
                    shade: 0.1,
                    area: ['800px', '600px'],
                    content: '/api/article/add'
                });
            } else if(obj.event === 'batchOffline'){
                var checkStatus = table.checkStatus(obj.config.id);
                if(checkStatus.data.length === 0){
                    layer.msg("未选中数据", {icon:3,time:1000});
                    return false;
                }
                layer.confirm('确定要下架选中的 ' + checkStatus.data.length + ' 篇文章吗？', {icon: 3, title:'提示'}, function(index){
                    layer.close(index);
                    let ids = checkStatus.data.map(function(item){return item.articleId});
                    $.ajax({
                        url: "/api/admin/article/batch/offline",
                        method: 'post',
                        contentType: 'application/json',
                        data: JSON.stringify(ids),
                        success:function(result){
                            if(result.code == 0){
                                layer.msg('下架成功', {icon:1,time:1000},function(){
                                    table.reload('article-table');
                                });
                            }else{
                                layer.msg(result.msg || '下架失败', {icon:2,time:1000});
                            }
                        }
                    });
                });
            }
        });

        // 监听行工具事件
        table.on('tool(article-table)', function(obj){
            if(obj.event === 'publish'){
                $.ajax({
                    url: "/api/admin/article/publish/" + obj.data['articleId'],
                    type: 'put',
                    success:function(result){
                        if(result.code == 0){
                            layer.msg('发布成功', {icon:1,time:1000});
                            obj.update();
                            table.reload('article-table');
                        }else{
                            layer.msg(result.msg || '发布失败', {icon:2,time:1000});
                        }
                    }
                });
            } else if(obj.event === 'remove'){
                layer.confirm('确定要删除该文章吗？', {icon: 3, title:'提示'}, function(index){
                    layer.close(index);
                    $.ajax({
                        url: "/api/admin/article/" + obj.data['articleId'],
                        type:'delete',
                        success:function(result){
                            if(result.code == 0){
                                layer.msg('删除成功', {icon:1,time:1000},function(){
                                    obj.del();
                                    table.reload('article-table');
                                });
                            }else{
                                layer.msg(result.msg || '删除失败', {icon:2,time:1000});
                            }
                        }
                    })
                });
            }
        });

        // 提交查询表单
        form.on('submit(article-query)', function(data){
            table.reload('article-table', {
                page: {
                    curr: 1
                }
            });
            return false;
        });

        // 监听重置按钮
        $('.pear-btn[type="reset"]').on('click', function(){
            table.reload('article-table', {
                page: {
                    curr: 1
                }
            });
        });

        // 加载统计数据
        function loadStatistics() {
            $.get('/api/admin/article/statistics', function(result){
                if(result.code == 0 && result.data && result.data.length > 0){
                    var stats = result.data[0];
                    $('#total-articles').text(stats.totalArticles || 0);
                    $('#today-articles').text(stats.todayArticles || 0);
                    $('#total-views').text(stats.totalViews || 0);
                    $('#total-likes').text(stats.totalLikes || 0);
                }
            });
        }
    });
</script>
</body>
</html>
